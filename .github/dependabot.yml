version: 2
updates:
  #
  # Gradle dependencies (build.gradle)
  #
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 10
    reviewers:
      - "oldzoomer"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "gradle"

  #
  # GitHub Actions
  #
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 5
    reviewers:
      - "oldzoomer"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"

  #
  # Docker
  #
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "oldzoomer"
    commit-message:
      prefix: "docker"
    labels:
      - "dependencies"
      - "docker"

  #
  # Git submodules
  #
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    reviewers:
      - "oldzoomer"
    commit-message:
      prefix: "submodule"
    labels:
      - "dependencies"
