# Test profile configuration
# Telegram bot is disabled via @Profile("!test") on TelegramBotConfig

spring:
  main:
    web-application-type: none

  # Datasource — points to Testcontainers PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/hackaton
    username: postgres
    password: postgres

  # Redis — points to Testcontainers Redis
  data:
    redis:
      host: localhost
      port: 6379

  # Disable SQL init (schema created by Testcontainers/Spring Boot)
  sql:
    init:
      mode: never

  # Disable scheduling in tests
  task:
    scheduling:
      enabled: false

  # Jackson
  jackson:
    serialization:
      write-dates-as-timestamps: false

# Telegram bot — dummy values (not used in tests)
telegram:
  bot:
    token: test-token
    username: test-bot

# Logging
logging:
  level:
    ru.oldzoomer.hackaton: DEBUG
