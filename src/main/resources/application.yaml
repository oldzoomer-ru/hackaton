spring:
  application:
    name: hackaton

  # Liquibase
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  # PostgreSQL Database (JDBC)
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  # Jackson
  jackson:
    serialization:
      write-dates-as-timestamps: false

  # Spring AI (Cloud.ru Foundation Models - OpenAI compatible)
  ai:
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY}
      base-url: ${SPRING_AI_OPENAI_BASE_URL:https://foundation-models.api.cloud.ru/v1}
      chat:
        options:
          model: ${SPRING_AI_OPENAI_MODEL:Qwen/Qwen3-30B-A3B}

# Telegram Bot Configuration
telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}
    username: ${TELEGRAM_BOT_USERNAME}
    creator-id: ${TELEGRAM_CREATOR_ID}
    proxy-url: ${TELEGRAM_PROXY_URL}
    telegram-api-endpoint: ${TELEGRAM_API_URL}
