services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/oldzoomer-ru/hackaton:master
    container_name: hackaton-app
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-docker}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${DB_NAME:-hackaton}
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-postgres}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME:-}
      - TELEGRAM_PROXY_URL=${TELEGRAM_PROXY_URL}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    container_name: hackaton-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-hackaton}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-hackaton}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
